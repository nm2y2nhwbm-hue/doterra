</head>
<body>

<a class="back-home-link" href="index.html">← 首頁</a>
<div class="brand-title"><h1>貴賓體驗預約</h1><p>MODERN OIL ORACLE</p></div>
<div class="ornament-divider">❀</div>

<main>
  <div id="booking-form-wrap">
    <p class="booking-intro">留下你的聯絡方式與此刻的心情，我們會依你的抽牌結果安排專屬的精油體驗諮詢與禮盒。</p>

    <form id="booking-form" class="booking-form">
      <div class="form-field">
        <label class="form-label" for="f-name">姓名 <span class="req">*</span></label>
        <input class="form-input" id="f-name" name="name" type="text" required maxlength="60" autocomplete="name">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-email">Email（與 LINE ID 至少填一項）</label>
        <input class="form-input" id="f-email" name="email" type="email" maxlength="120" autocomplete="email">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-line">LINE ID（與 Email 至少填一項）</label>
        <input class="form-input" id="f-line" name="lineId" type="text" maxlength="60" autocomplete="off">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-date">預約日期</label>
        <input class="form-input" id="f-date" name="bookingDate" type="date">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-concern">主要困擾</label>
        <input class="form-input" id="f-concern" name="mainConcern" type="text" maxlength="120" placeholder="例如：工作壓力、人際關係、睡眠品質……">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-mood">當下心情</label>
        <input class="form-input" id="f-mood" name="mood" type="text" maxlength="120" placeholder="例如：焦慮、平靜、期待……">
      </div>
      <div class="form-field">
        <label class="form-label" for="f-question">諮詢問題</label>
        <textarea class="form-input form-textarea" id="f-question" name="question" maxlength="500" rows="3"></textarea>
      </div>
      <div class="form-field">
        <label class="form-label" for="f-note">補充說明</label>
        <textarea class="form-input form-textarea" id="f-note" name="note" maxlength="500" rows="3"></textarea>
      </div>

      <div id="draw-code-note" class="draw-code-note" style="display:none;" role="status" aria-live="polite"></div>

      <div id="booking-form-msg" class="admin-msg" role="alert" aria-live="assertive"></div>
      <button type="submit" class="form-submit-btn" id="booking-submit-btn">送出預約</button>
      <p class="booking-disclaimer">送出即表示同意我們以上述聯絡方式與你確認預約內容。此服務不做醫療、心理或投資專業建議。</p>
    </form>

    <div id="booking-confirm" class="booking-confirm" style="display:none;" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="supabase-client.js?v=1"></script>
<script src="booking.js?v=2"></script>
</body>
</html>
