<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>現代精油心靈指引卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<a class="back-home-link" href="index.html">← 首頁</a>
<div class="brand-title"><h1>現代精油心靈指引卡</h1><p>MODERN OIL ORACLE</p></div>
<div class="ornament-divider">❀</div>

<main>

  <div id="mode-select">
    <a href="#" id="guide-book-link" class="guide-book-link">📖 卡牌說明書</a>
    <div class="category-question">今天，想怎麼問自己？</div>
    <div class="category-row" id="category-row">
      <button type="button" class="category-card" data-cat="mirror">
        <div class="cc-icon">鏡</div>
        <div class="cc-name">鏡子</div>
        <div class="cc-tagline">照看你的此時此刻</div>
      </button>
      <button type="button" class="category-card" data-cat="river">
        <div class="cc-icon">河</div>
        <div class="cc-name">河流</div>
        <div class="cc-tagline">陪伴你的時間流動</div>
      </button>
      <button type="button" class="category-card" data-cat="crossroad">
        <div class="cc-icon">岔</div>
        <div class="cc-name">岔路</div>
        <div class="cc-tagline">站在十字路口的香氣陪伴</div>
      </button>
    </div>
    <div class="category-detail" id="category-detail">
      <div class="cd-eyebrow" id="cd-eyebrow"></div>
      <div class="cd-title" id="cd-title"></div>
      <div class="cd-sub" id="cd-sub"></div>
      <div class="cd-modes" id="cd-modes"></div>
    </div>
  </div>

  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <div id="mode5-intro" class="mode5-intro" style="display:none;">
      <p class="mode5-intro-sub">先靜心看著牌堆，準備好後再選擇指示牌</p>
      <div class="mode5-card-back"></div>
      <button type="button" class="home-cta primary" id="mode5-ready-btn">準備好了，選擇指示牌</button>
    </div>

    <div id="indicator-select"></div>

    <div id="fan-wrap">
      <div id="fan-stage"></div>
      <div class="deck-hint" id="deck-hint"></div>
      <div id="drawn-row"></div>
    </div>

    <div id="experience-panel" class="experience-panel" style="display:none;"></div>
    <div class="send-status" id="send-status"></div>
    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<script src="supabase-client.js?v=4"></script>
<script src="mode-catalog.js?v=1"></script>
<script src="script.js?v=13"></script>
<script src="site-fixes.js?v=2"></script>
</body>
</html>
