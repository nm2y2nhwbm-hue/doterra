<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>多特瑞精油洞悉卡</title>
<style>
  :root{
    --parchment:#F3EAE0;
    --parchment-deep:#E8DCCC;
    --ink:#3F332B;
    --rose:#8C3B46;
    --rose-deep:#6E2B34;
    --sage:#78876B;
    --gold:#B8912E;
    --card-back:#F6EFE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Serif TC","Songti TC",serif;
    background:radial-gradient(ellipse at top,#F8F1E6 0%,var(--parchment) 55%,var(--parchment-deep) 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .brand-title{
    font-family:"Cormorant Garamond","Noto Serif TC",serif;
    text-align:center;
    padding:28px 16px 6px;
    letter-spacing:.12em;
  }
  .brand-title h1{
    font-size:clamp(22px,5vw,34px);
    margin:0 0 4px;
    color:var(--rose-deep);
    font-weight:600;
  }
  .brand-title p{
    margin:0;
    font-size:12px;
    color:var(--sage);
    letter-spacing:.3em;
  }
  .rose-divider{
    display:flex;align-items:center;justify-content:center;gap:10px;
    color:var(--gold);opacity:.7;margin:10px auto 18px;
  }
  .rose-divider::before,.rose-divider::after{
    content:"";flex:1;max-width:70px;height:1px;background:var(--gold);opacity:.5;
  }

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px 100px;}

  /* ---------- 模式選單 ---------- */
  #mode-select{
    width:100%;max-width:520px;
    display:flex;flex-direction:column;gap:14px;margin-top:6px;
  }
  .mode-btn{
    background:linear-gradient(135deg,#fff8ef,var(--parchment));
    border:1px solid rgba(184,145,46,.4);
    border-radius:14px;
    padding:16px 20px;
    text-align:left;
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease;
    box-shadow:0 2px 6px rgba(63,51,43,.08);
    display:flex;align-items:center;gap:14px;
  }
  .mode-btn:active{transform:scale(.98);}
  .mode-btn:hover{box-shadow:0 6px 16px rgba(140,59,70,.18);border-color:var(--rose);}
  .mode-num{
    font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--rose);
    width:34px;text-align:center;flex-shrink:0;
  }
  .mode-text b{display:block;font-size:16px;color:var(--ink);}
  .mode-text span{font-size:12.5px;color:#7a6d5f;}

  /* ---------- 舞台區（洗牌 / 抽牌 / 結果） ---------- */
  #stage{width:100%;max-width:640px;display:none;flex-direction:column;align-items:center;}
  #stage.active{display:flex;}

  .stage-header{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;margin-bottom:10px;
  }
  .back-btn{
    background:none;border:1px solid var(--rose);color:var(--rose);
    border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;
  }
  .stage-title{font-size:15px;color:var(--rose-deep);letter-spacing:.05em;}

  .instruction{
    font-size:13.5px;color:#6b5d4f;text-align:center;margin:6px 0 18px;min-height:18px;
  }

  /* 洗牌動畫舞台 */
  #shuffle-zone{
    position:relative;width:180px;height:250px;margin:20px auto 10px;
  }
  .shuffle-card{
    position:absolute;top:0;left:0;width:180px;height:250px;
    border-radius:14px;
    background:
      radial-gradient(circle at 50% 30%, #fffaf2 0, var(--card-back) 60%),
      repeating-linear-gradient(45deg, rgba(184,145,46,.06) 0 10px, transparent 10px 20px);
    border:2px solid var(--gold);
    box-shadow:0 6px 18px rgba(63,51,43,.18);
  }
  .shuffle-card::after{
    content:"❀";
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:34px;color:var(--rose);opacity:.55;
  }
  .shuffle-anim .shuffle-card{ animation:shuffleMove 1.1s ease-in-out infinite; }
  .shuffle-anim .shuffle-card:nth-child(1){animation-delay:0s;}
  .shuffle-anim .shuffle-card:nth-child(2){animation-delay:.12s;}
  .shuffle-anim .shuffle-card:nth-child(3){animation-delay:.24s;}
  @keyframes shuffleMove{
    0%{transform:translateX(0) rotate(0deg);}
    25%{transform:translateX(-16px) rotate(-6deg);}
    50%{transform:translateX(0) rotate(0deg);}
    75%{transform:translateX(16px) rotate(6deg);}
    100%{transform:translateX(0) rotate(0deg);}
  }

  /* 抽牌區：待抽（背面）卡堆，點擊翻牌 */
  #draw-zone{
    display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:6px;
  }
  .draw-slot{
    display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .slot-label{font-size:12px;color:var(--sage);letter-spacing:.08em;}
  .flip-card{
    width:150px;height:210px;perspective:1000px;cursor:pointer;
  }
  .flip-card.disabled{cursor:default;}
  .flip-inner{
    position:relative;width:100%;height:100%;
    transition:transform .65s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute;inset:0;backface-visibility:hidden;
    border-radius:12px;overflow:hidden;
    box-shadow:0 4px 14px rgba(63,51,43,.18);
    border:1.5px solid var(--gold);
  }
  .flip-front{
    background:
      radial-gradient(circle at 50% 30%, #fffaf2 0, var(--card-back) 60%),
      repeating-linear-gradient(45deg, rgba(184,145,46,.06) 0 10px, transparent 10px 20px);
    display:flex;align-items:center;justify-content:center;
  }
  .flip-front::after{content:"❀";font-size:30px;color:var(--rose);opacity:.55;}
  .flip-back{
    transform:rotateY(180deg);
    background:#fff;
    display:flex;flex-direction:column;
  }
  .flip-back img{width:100%;height:58%;object-fit:cover;}
  .flip-back .cap{
    flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:4px 6px;text-align:center;
  }
  .flip-back .cap b{font-size:13px;color:var(--rose-deep);}
  .flip-back .cap span{font-size:10px;color:#8a7c6c;}

  /* 結果詳解卡 */
  #reveal-detail{
    width:100%;max-width:520px;margin-top:22px;
    display:none;flex-direction:column;gap:14px;
  }
  #reveal-detail.active{display:flex;}
  .detail-card{
    background:#fffaf3;border:1px solid rgba(184,145,46,.35);border-radius:14px;
    padding:16px 18px;box-shadow:0 3px 10px rgba(63,51,43,.08);
  }
  .detail-card .dc-label{font-size:11.5px;color:var(--sage);letter-spacing:.1em;margin-bottom:4px;}
  .detail-card .dc-name{font-size:18px;color:var(--rose-deep);font-weight:600;}
  .detail-card .dc-name-en{font-size:12px;color:#9a8c7b;margin-bottom:8px;}
  .detail-card .dc-keywords{font-size:13px;color:var(--ink);margin-bottom:6px;}
  .detail-card .dc-guidance{font-size:13.5px;line-height:1.75;color:#4a3f35;}
  .detail-card .dc-chakra{font-size:11.5px;color:var(--sage);margin-top:8px;}

  .again-btn{
    margin:18px auto 0;background:var(--rose);color:#fff;border:none;
    border-radius:24px;padding:11px 30px;font-size:14px;cursor:pointer;
    box-shadow:0 4px 12px rgba(140,59,70,.3);
  }
  .again-btn:active{transform:scale(.97);}

  /* ---------- 底部固定 LINE 引流 ---------- */
  #line-cta{
    position:fixed;bottom:0;left:0;right:0;
    background:linear-gradient(180deg,rgba(243,234,224,0) 0%,var(--parchment) 30%);
    padding:14px 16px 18px;display:flex;justify-content:center;
  }
  #line-cta a{
    display:inline-flex;align-items:center;gap:8px;
    background:#06C755;color:#fff;text-decoration:none;
    padding:11px 26px;border-radius:24px;font-size:14px;font-weight:600;
    box-shadow:0 4px 14px rgba(6,199,85,.35);
  }

  @media (max-width:380px){
    .flip-card{width:120px;height:168px;}
    #shuffle-zone{width:140px;height:196px;}
    .shuffle-card{width:140px;height:196px;}
  }
</style>
</head>
<body>

<div class="brand-title">
  <h1>多特瑞精油洞悉卡</h1>
  <p>MODERN OIL ORACLE</p>
</div>
<div class="rose-divider">❀</div>

<main>

  <!-- 模式選單 -->
  <div id="mode-select">
    <div class="mode-btn" data-mode="1">
      <div class="mode-num">01</div>
      <div class="mode-text"><b>單張心靈小語</b><span>洗牌 → 點擊抽 1 張，當日心靈肯定</span></div>
    </div>
    <div class="mode-btn" data-mode="2">
      <div class="mode-num">02</div>
      <div class="mode-text"><b>生活導引牌陣</b><span>洗牌 → 依序抽 2 張，整體狀況與建議方向</span></div>
    </div>
    <div class="mode-btn" data-mode="3">
      <div class="mode-num">03</div>
      <div class="mode-text"><b>療癒身心靈牌陣</b><span>洗牌 → 依序抽 3 張，身・心・靈三面向</span></div>
    </div>
    <div class="mode-btn" data-mode="4">
      <div class="mode-num">04</div>
      <div class="mode-text"><b>瞭解自我牌陣</b><span>洗牌 → 依序抽 3 張，他人眼中／獨處時／真正的你</span></div>
    </div>
    <div class="mode-btn" data-mode="5">
      <div class="mode-num">05</div>
      <div class="mode-text"><b>單一指示牌陣</b><span>洗牌 → 抽 1 張指示牌，再對應 2 張精油牌</span></div>
    </div>
  </div>

  <!-- 舞台區 -->
  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <div id="shuffle-zone" style="display:none;">
      <div class="shuffle-card"></div>
      <div class="shuffle-card"></div>
      <div class="shuffle-card"></div>
    </div>

    <div id="draw-zone"></div>

    <div id="reveal-detail"></div>

    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<div id="line-cta">
  <a href="https://line.me/R/ti/p/@your-line-id" target="_blank" rel="noopener">
    加入 LINE 官方帳號 →
  </a>
</div>

<script>
(function(){
  "use strict";

  const modeSelect = document.getElementById('mode-select');
  const stage = document.getElementById('stage');
  const stageTitle = document.getElementById('stage-title');
  const instruction = document.getElementById('instruction');
  const shuffleZone = document.getElementById('shuffle-zone');
  const drawZone = document.getElementById('draw-zone');
  const revealDetail = document.getElementById('reveal-detail');
  const againBtn = document.getElementById('again-btn');
  const backBtn = document.getElementById('back-btn');

  let OILS = [];
  let INDICATORS = [];

  const MODE_CONFIG = {
    1: { title: "單張心靈小語", count: 1, labels: ["今日心靈小語"] },
    2: { title: "生活導引牌陣", count: 2, labels: ["目前整體狀況", "生活中所需的建議及方向"] },
    3: { title: "療癒身心靈牌陣", count: 3, labels: ["身・目前身體狀況", "心・目前心理狀態", "靈・目前精神狀況"] },
    4: { title: "瞭解自我牌陣", count: 3, labels: ["別人眼中的你", "私底下獨處時的你", "真正自我的你"] },
    5: { title: "單一指示牌陣", count: null, labels: null } // 特殊處理
  };

  async function loadData(){
    const [oilsRes, indRes] = await Promise.all([
      fetch('/api/oils'), fetch('/api/indicators')
    ]);
    OILS = await oilsRes.json();
    INDICATORS = await indRes.json();
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  function sampleUnique(pool, n){
    return shuffle(pool).slice(0, n);
  }

  function resetStageDom(){
    drawZone.innerHTML = '';
    revealDetail.innerHTML = '';
    revealDetail.classList.remove('active');
    againBtn.style.display = 'none';
    shuffleZone.style.display = 'none';
    shuffleZone.classList.remove('shuffle-anim');
  }

  function showModeSelect(){
    stage.classList.remove('active');
    modeSelect.style.display = 'flex';
  }

  function enterStage(modeId){
    modeSelect.style.display = 'none';
    stage.classList.add('active');
    resetStageDom();

    const cfg = MODE_CONFIG[modeId];
    stageTitle.textContent = cfg.title;
    instruction.textContent = '正在為您洗牌，請稍候……';

    shuffleZone.style.display = 'block';
    shuffleZone.classList.add('shuffle-anim');

    setTimeout(() => {
      shuffleZone.classList.remove('shuffle-anim');
      shuffleZone.style.display = 'none';
      if (modeId === 5) {
        startMode5();
      } else {
        startStandardMode(modeId);
      }
    }, 1200);
  }

  function buildFlipCard(label, card, onReveal){
    const wrap = document.createElement('div');
    wrap.className = 'draw-slot';

    const lbl = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.textContent = label;
    wrap.appendChild(lbl);

    const flip = document.createElement('div');
    flip.className = 'flip-card';
    flip.innerHTML = `
      <div class="flip-inner">
        <div class="flip-face flip-front"></div>
        <div class="flip-face flip-back">
          <img src="${card.image_url}" alt="${card.name}">
          <div class="cap"><b>${card.name}</b><span>${card.name_en || ''}</span></div>
        </div>
      </div>`;
    flip.addEventListener('click', function handler(){
      if (flip.classList.contains('flipped')) return;
      flip.classList.add('flipped');
      flip.removeEventListener('click', handler);
      if (onReveal) onReveal(card);
    });
    wrap.appendChild(flip);
    return wrap;
  }

  function appendDetail(label, card){
    const el = document.createElement('div');
    el.className = 'detail-card';
    el.innerHTML = `
      <div class="dc-label">${label}</div>
      <div class="dc-name">${card.name}</div>
      <div class="dc-name-en">${card.name_en || ''}</div>
      ${card.keywords ? `<div class="dc-keywords">${card.keywords}</div>` : ''}
      ${card.guidance ? `<div class="dc-guidance">${card.guidance}</div>` : ''}
      ${card.chakra ? `<div class="dc-chakra">脈輪：${card.chakra}</div>` : ''}
    `;
    revealDetail.appendChild(el);
    revealDetail.classList.add('active');
  }

  function startStandardMode(modeId){
    const cfg = MODE_CONFIG[modeId];
    const drawn = sampleUnique(OILS, cfg.count);

    instruction.textContent = cfg.count === 1
      ? '點擊卡牌，翻開屬於你的今日訊息'
      : `請依序點擊，翻開全部 ${cfg.count} 張牌`;

    let revealedCount = 0;
    drawn.forEach((card, idx) => {
      const label = cfg.labels[idx];
      const slot = buildFlipCard(label, card, (c) => {
        appendDetail(label, c);
        revealedCount++;
        if (revealedCount === cfg.count) {
          instruction.textContent = '解讀完成 ✦ 願這份訊息與你同在';
          againBtn.style.display = 'inline-block';
        }
      });
      drawZone.appendChild(slot);
    });
  }

  function startMode5(){
    instruction.textContent = '請先點擊，翻開你的指示牌';
    const indicator = INDICATORS[Math.floor(Math.random() * INDICATORS.length)];

    const indicatorSlot = buildFlipCard('指示牌', indicator, (c) => {
      appendDetail('指示牌', c);
      instruction.textContent = `「${c.name}」為你點出的主題，接著抽出兩側的精油指引`;
      revealOilPair(c.name);
    });
    drawZone.appendChild(indicatorSlot);
  }

  function revealOilPair(indicatorName){
    const pair = sampleUnique(OILS, 2);
    const labels = [
      `「${indicatorName}」左側提升精油`,
      `「${indicatorName}」右側提升精油`
    ];
    let revealedCount = 0;
    pair.forEach((card, idx) => {
      const label = labels[idx];
      const slot = buildFlipCard(label, card, (c) => {
        appendDetail(label, c);
        revealedCount++;
        if (revealedCount === 2) {
          instruction.textContent = '解讀完成 ✦ 願這份訊息與你同在';
          againBtn.style.display = 'inline-block';
        }
      });
      drawZone.appendChild(slot);
    });
  }

  modeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    enterStage(Number(btn.dataset.mode));
  });

  backBtn.addEventListener('click', showModeSelect);
  againBtn.addEventListener('click', showModeSelect);

  loadData().then(() => {
    instruction.textContent = '';
  }).catch(() => {
    instruction.textContent = '資料讀取失敗，請重新整理頁面再試一次。';
  });
})();
</script>

</body>
</html>
