<!DOCTYPE html>

<head>

<title>現代精油心靈指引卡</title>
<meta name="description" content="從鏡子、河流與岔路三類牌陣中選擇此刻的問題，抽一張精油心靈指引卡。內容為自我探索用途，非醫療建議。">
<link rel="canonical" href="https://doterra-two.vercel.app/cards.html">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta property="og:site_name" content="現代精油心靈指引卡">
<meta property="og:title" content="免費線上抽牌｜現代精油心靈指引卡">
<meta property="og:description" content="用 3 分鐘停下來，讓精油心靈指引卡陪你整理此刻的感受。">
<meta property="og:url" content="https://doterra-two.vercel.app/cards.html">
<meta property="og:image" content="https://doterra-two.vercel.app/images/og-modern-oil-oracle.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="現代精油心靈指引卡品牌分享圖">

<meta name="theme-color" content="#355343">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>

<a class="back-home-link" href="index.html">← 首頁</a>
<div class="brand-title"><h1>現代精油心靈指引卡</h1><p>MODERN OIL ORACLE</p></div>
<div class="ornament-divider">❀</div>

<main>

  <div id="mode-select">
    <a href="#" id="guide-book-link" class="guide-book-link">📖 卡牌說明書</a>
    <div class="card-data-state" id="card-data-state" role="status" aria-live="polite">正在載入牌卡資料…</div>
    <button type="button" class="card-data-retry" id="card-data-retry" hidden>重新載入牌卡</button>
    <div class="category-question">今天，想怎麼問自己？</div>
    <div class="category-row" id="category-row">
      <button type="button" class="category-card" data-cat="mirror" aria-pressed="false">
        <div class="cc-icon">鏡</div>
        <div class="cc-name">鏡子</div>
        <div class="cc-tagline">照看你的此時此刻</div>
      </button>
      <button type="button" class="category-card" data-cat="river" aria-pressed="false">
        <div class="cc-icon">河</div>
        <div class="cc-name">河流</div>
        <div class="cc-tagline">陪伴你的時間流動</div>
      </button>
      <button type="button" class="category-card" data-cat="crossroad" aria-pressed="false">
        <div class="cc-icon">岔</div>
        <div class="cc-name">岔路</div>
        <div class="cc-tagline">站在十字路口的香氣陪伴</div>
      </button>
    </div>
    <div class="category-detail" id="category-detail">
      <div class="cd-eyebrow" id="cd-eyebrow"></div>
      <div class="cd-title" id="cd-title"></div>
      <div class="cd-sub" id="cd-sub"></div>
      <div class="cd-modes" id="cd-modes"></div>
    </div>
  </div>

  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <div id="mode5-intro" class="mode5-intro" style="display:none;">
      <p class="mode5-intro-sub">先靜心看著牌堆，準備好後再選擇指示牌</p>
      <div class="mode5-card-back"></div>
      <button type="button" class="home-cta primary" id="mode5-ready-btn">準備好了，選擇指示牌</button>
    </div>

    <div id="indicator-select"></div>

    <div id="fan-wrap">
      <div id="fan-stage"></div>
      <div class="deck-hint" id="deck-hint"></div>
      <div id="drawn-row"></div>
    </div>

    <div id="experience-panel" class="experience-panel" style="display:none;"></div>
    <div class="send-status" id="send-status"></div>
    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<script src="supabase-client.js?v=4"></script>
<script src="mode-catalog.js?v=1"></script>
<script src="guide-modal.js?v=1"></script>
<script src="script.js?v=15"></script>
</body>
</html>
