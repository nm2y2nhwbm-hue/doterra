<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>多特瑞精油洞悉卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<header class="site-nav">
  <div class="site-nav-inner">
    <span class="site-nav-logo">多特瑞精油洞悉卡</span>
    <button class="site-nav-cta" id="nav-book-btn" type="button">預約體驗</button>
  </div>
</header>

<div class="brand-title"><h1>多特瑞精油洞悉卡</h1><p>MODERN OIL ORACLE</p></div>
<div class="ornament-divider">❀</div>

<main>

  <div id="mode-select">
    <div class="mode-btn" data-mode="1"><div class="mode-num">01</div><div class="mode-text"><b>今日能量</b><span>單張心靈肯定小語</span></div></div>
    <div class="mode-btn" data-mode="2"><div class="mode-num">02</div><div class="mode-text"><b>生活導引</b><span>現階段狀態與方向指引</span></div></div>
    <div class="mode-btn" data-mode="3"><div class="mode-num">03</div><div class="mode-text"><b>三牌陣</b><span>身・心・靈全方位深度解析</span></div></div>
    <div class="mode-btn" data-mode="4"><div class="mode-num">04</div><div class="mode-text"><b>了解自我</b><span>別人眼中的你與真正的你</span></div></div>
    <div class="mode-btn" data-mode="5"><div class="mode-num">05</div><div class="mode-text"><b>指示牌</b><span>單一指示牌與精油對應占卜</span></div></div>
  </div>

  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <div id="indicator-select"></div>

    <div id="fan-wrap">
      <div id="fan-stage"></div>
      <div class="deck-hint" id="deck-hint"></div>
      <div id="drawn-row"></div>
    </div>

    <div id="reveal-detail"></div>
    <div class="send-status" id="send-status"></div>
    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<nav class="mobile-bar">
  <button class="mobile-bar-btn primary" id="bar-draw-btn" type="button">線上抽卡</button>
  <button class="mobile-bar-btn secondary" id="bar-gift-btn" type="button">預約禮盒</button>
</nav>
<div class="site-toast" id="site-toast"></div>

<script src="script.js?v=6"></script>
</body>
</html>
