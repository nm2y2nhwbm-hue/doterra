<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>多特瑞精油洞悉卡</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --parchment:#F3EAE0; --parchment-deep:#E8DCCC;
    --ink:#3F332B; --rose:#8C3B46; --rose-deep:#6E2B34;
    --sage:#78876B; --gold:#B8912E; --card-back:#F6EFE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Serif TC","Songti TC",serif;
    background:radial-gradient(ellipse at top,#F8F1E6 0%,var(--parchment) 55%,var(--parchment-deep) 100%);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  }
  .brand-title{font-family:"Cormorant Garamond","Noto Serif TC",serif;text-align:center;padding:20px 16px 4px;letter-spacing:.12em;}
  .brand-title h1{font-size:clamp(18px,5vw,26px);margin:0 0 4px;color:var(--rose-deep);font-weight:600;}
  .brand-title p{margin:0;font-size:10.5px;color:var(--sage);letter-spacing:.3em;}
  .rose-divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);opacity:.7;margin:6px auto 14px;}
  .rose-divider::before,.rose-divider::after{content:"";flex:1;max-width:60px;height:1px;background:var(--gold);opacity:.5;}

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 12px 100px;width:100%;}

  #mode-select{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;margin-top:4px;}
  .mode-btn{background:linear-gradient(135deg,#fff8ef,var(--parchment));border:1px solid rgba(184,145,46,.4);border-radius:14px;padding:14px 18px;text-align:left;cursor:pointer;box-shadow:0 2px 6px rgba(63,51,43,.08);display:flex;align-items:center;gap:12px;}
  .mode-btn:active{transform:scale(.98);}
  .mode-num{font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--rose);width:30px;text-align:center;flex-shrink:0;}
  .mode-text b{display:block;font-size:15px;color:var(--ink);}
  .mode-text span{font-size:11.5px;color:#7a6d5f;}

  #stage{width:100%;max-width:640px;display:none;flex-direction:column;align-items:center;}
  #stage.active{display:flex;}
  .stage-header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:6px;}
  .back-btn{background:none;border:1px solid var(--rose);color:var(--rose);border-radius:20px;padding:5px 12px;font-size:12.5px;cursor:pointer;}
  .stage-title{font-size:14px;color:var(--rose-deep);letter-spacing:.05em;}
  .instruction{font-size:13px;color:#6b5d4f;text-align:center;margin:4px 0 6px;min-height:18px;}

  /* --- 模式5：指示標題選單 --- */
  #indicator-select{display:none;flex-direction:column;gap:8px;width:100%;max-width:420px;margin:8px 0 16px;}
  .indicator-item{background:#fffaf3;border:1px solid rgba(184,145,46,.35);border-radius:10px;padding:11px 16px;font-size:14px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
  .indicator-item:active{background:var(--parchment-deep);}
  .indicator-item .en{font-size:10.5px;color:#9a8c7b;}

  /* --- 扇形排開牌組 --- */
  #fan-wrap{width:100%;display:none;flex-direction:column;align-items:center;}
  #fan-stage{
    position:relative; width:100%; max-width:560px; height:190px;
    margin:8px auto 4px; display:flex; align-items:flex-end; justify-content:center;
  }
  #fan-stage.shuffling .fan-card{ animation:fanShuffle .9s ease-in-out infinite; }
  @keyframes fanShuffle{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.06); }
  }
  .fan-card{
    position:absolute; bottom:0; width:92px; height:130px; border-radius:10px;
    background:
      radial-gradient(circle at 50% 30%, #fffaf2 0, var(--card-back) 60%),
      repeating-linear-gradient(45deg, rgba(184,145,46,.06) 0 10px, transparent 10px 20px);
    border:1.6px solid var(--gold);
    box-shadow:0 3px 8px rgba(63,51,43,.18);
    transform-origin:bottom center;
    transition:transform .25s ease, box-shadow .25s ease, top .3s ease;
    cursor:pointer;
  }
  .fan-card::after{content:"❀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--rose);opacity:.5;}
  .fan-card:active{ box-shadow:0 6px 16px rgba(140,59,70,.3); }
  .fan-card.revealed{
    background:#fff; pointer-events:none;
  }
  .fan-card.revealed::after{display:none;}
  .fan-card.revealed img{width:100%;height:70%;object-fit:cover;border-radius:10px 10px 0 0;}
  .fan-card.revealed .mini-cap{font-size:8.5px;text-align:center;color:var(--rose-deep);padding:2px 2px;line-height:1.2;}
  .fan-card.dimmed{ opacity:.28; pointer-events:none; }
  .fan-card.spotlight{ box-shadow:0 0 0 3px var(--rose), 0 6px 16px rgba(140,59,70,.35); z-index:5; }

  .deck-hint{font-size:12px;color:var(--sage);margin-top:6px;}

  /* 已抽出的卡（詳解排列） */
  #drawn-row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:14px;}
  .drawn-slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .drawn-slot .slot-label{font-size:11px;color:var(--sage);letter-spacing:.05em;}
  .drawn-card{width:120px;height:168px;border-radius:12px;overflow:hidden;border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(63,51,43,.16);background:#fff;display:flex;flex-direction:column;animation:cardReveal .5s ease;}
  @keyframes cardReveal{ from{opacity:0;transform:translateY(10px) scale(.95);} to{opacity:1;transform:translateY(0) scale(1);} }
  .drawn-card img{width:100%;height:58%;object-fit:cover;}
  .drawn-card .cap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 6px;text-align:center;}
  .drawn-card .cap b{font-size:11.5px;color:var(--rose-deep);}
  .drawn-card .cap span{font-size:9px;color:#8a7c6c;}

  #reveal-detail{width:100%;max-width:520px;margin-top:18px;display:none;flex-direction:column;gap:12px;}
  #reveal-detail.active{display:flex;}
  .detail-card{background:#fffaf3;border:1px solid rgba(184,145,46,.35);border-radius:14px;padding:14px 16px;box-shadow:0 3px 10px rgba(63,51,43,.08);}
  .detail-card .dc-label{font-size:11px;color:var(--sage);letter-spacing:.1em;margin-bottom:4px;}
  .detail-card .dc-name{font-size:17px;color:var(--rose-deep);font-weight:600;}
  .detail-card .dc-name-en{font-size:11.5px;color:#9a8c7b;margin-bottom:6px;}
  .detail-card .dc-keywords{font-size:12.5px;color:var(--ink);margin-bottom:6px;}
  .detail-card .dc-guidance{font-size:13px;line-height:1.7;color:#4a3f35;}
  .detail-card .dc-chakra{font-size:11px;color:var(--sage);margin-top:8px;}

  .again-btn{margin:16px auto 0;background:var(--rose);color:#fff;border:none;border-radius:24px;padding:10px 28px;font-size:13.5px;cursor:pointer;box-shadow:0 4px 12px rgba(140,59,70,.3);}
  .again-btn:active{transform:scale(.97);}

  #line-cta{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(243,234,224,0) 0%,var(--parchment) 30%);padding:12px 16px 16px;display:flex;justify-content:center;}
  #line-cta a{display:inline-flex;align-items:center;gap:8px;background:#06C755;color:#fff;text-decoration:none;padding:10px 24px;border-radius:24px;font-size:13.5px;font-weight:600;box-shadow:0 4px 14px rgba(6,199,85,.35);}
</style>
</head>
<body>

<div class="brand-title"><h1>多特瑞精油洞悉卡</h1><p>MODERN OIL ORACLE</p></div>
<div class="rose-divider">❀</div>

<main>

  <div id="mode-select">
    <div class="mode-btn" data-mode="1"><div class="mode-num">01</div><div class="mode-text"><b>今日能量</b><span>單張心靈肯定小語</span></div></div>
    <div class="mode-btn" data-mode="2"><div class="mode-num">02</div><div class="mode-text"><b>生活導引</b><span>現階段狀態與方向指引</span></div></div>
    <div class="mode-btn" data-mode="3"><div class="mode-num">03</div><div class="mode-text"><b>三牌陣</b><span>身・心・靈全方位深度解析</span></div></div>
    <div class="mode-btn" data-mode="4"><div class="mode-num">04</div><div class="mode-text"><b>了解自我</b><span>別人眼中的你與真正的你</span></div></div>
    <div class="mode-btn" data-mode="5"><div class="mode-num">05</div><div class="mode-text"><b>指示牌</b><span>單一指示牌與精油對應占卜</span></div></div>
  </div>

  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <div id="indicator-select"></div>

    <div id="fan-wrap">
      <div id="fan-stage"></div>
      <div class="deck-hint" id="deck-hint"></div>
      <div id="drawn-row"></div>
    </div>

    <div id="reveal-detail"></div>
    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<div id="line-cta">
  <a href="https://line.me/R/ti/p/@your-line-id" target="_blank" rel="noopener">加入 LINE 官方帳號 →</a>
</div>

<script>
(function(){
  "use strict";

  const modeSelect = document.getElementById('mode-select');
  const stage = document.getElementById('stage');
  const stageTitle = document.getElementById('stage-title');
  const instruction = document.getElementById('instruction');
  const indicatorSelect = document.getElementById('indicator-select');
  const fanWrap = document.getElementById('fan-wrap');
  const fanStage = document.getElementById('fan-stage');
  const deckHint = document.getElementById('deck-hint');
  const drawnRow = document.getElementById('drawn-row');
  const revealDetail = document.getElementById('reveal-detail');
  const againBtn = document.getElementById('again-btn');
  const backBtn = document.getElementById('back-btn');

  let OILS = [];
  let INDICATORS = [];

  const MODE_CONFIG = {
    1: { title: "今日能量", count: 1, labels: ["今日心靈小語"] },
    2: { title: "生活導引", count: 2, labels: ["目前整體狀況", "生活中所需的建議及方向"] },
    3: { title: "三牌陣",   count: 3, labels: ["身・目前身體狀況", "心・目前心理狀態", "靈・目前精神狀況"] },
    4: { title: "了解自我", count: 3, labels: ["別人眼中的你", "私底下獨處時的你", "真正自我的你"] },
  };

  const FAN_POOL_SIZE = 12;   // 扇形展示的張數（含指示卡時為 12 張混合）
  let fanItems = [];          // { card, isIndicator, el }
  let drawPlan = [];
  let drawnCount = 0;
  let selectedIndicatorName = null;
  let isMode5 = false;

  async function loadData(){
    const [oilsRes, indRes] = await Promise.all([fetch('/api/oils'), fetch('/api/indicators')]);
    OILS = await oilsRes.json();
    INDICATORS = await indRes.json();
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function resetStageDom(){
    indicatorSelect.style.display = 'none';
    indicatorSelect.innerHTML = '';
    fanWrap.style.display = 'none';
    fanStage.innerHTML = '';
    fanStage.classList.remove('shuffling');
    drawnRow.innerHTML = '';
    revealDetail.innerHTML = '';
    revealDetail.classList.remove('active');
    againBtn.style.display = 'none';
    fanItems = [];
    drawPlan = [];
    drawnCount = 0;
    selectedIndicatorName = null;
    isMode5 = false;
  }

  function showModeSelect(){
    stage.classList.remove('active');
    modeSelect.style.display = 'flex';
  }

  function enterStage(modeId){
    modeSelect.style.display = 'none';
    stage.classList.add('active');
    resetStageDom();

    if (modeId === 5) {
      isMode5 = true;
      stageTitle.textContent = '指示牌';
      instruction.textContent = '請先從下方選擇一個你想探索的主題';
      renderIndicatorList();
      return;
    }

    const cfg = MODE_CONFIG[modeId];
    stageTitle.textContent = cfg.title;
    drawPlan = cfg.labels;
    const pool = shuffle(OILS).slice(0, FAN_POOL_SIZE).map(c => ({card:c, isIndicator:false}));
    startShuffleThenFan(pool);
  }

  const INDICATOR_THEMES = {
    "魚": "若你的問題與金錢有關，使內在與外在能夠處於平衡狀態",
    "愛心": "若你的問題與愛情有關",
    "戒指": "若你的問題與婚姻有關",
    "孩童": "若你的問題與孩子有關",
    "狗": "若你的問題與朋友有關",
    "月亮": "若你的問題與名聲或成就有關",
    "樹": "若你的問題與健康有關",
    "十字路口": "若你的問題與下決定有關",
    "船": "若你的問題與旅行有關",
    "鸛鳥": "若你的問題與改變或升遷有關",
    "房屋": "若你的問題與家有關",
    "熊": "若你的問題與老闆有關",
  };

  function renderIndicatorList(){
    indicatorSelect.style.display = 'flex';
    INDICATORS.forEach(ind => {
      const item = document.createElement('div');
      item.className = 'indicator-item';
      const theme = INDICATOR_THEMES[ind.name] || '';
      item.innerHTML = `
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span><b>${ind.name}</b> <span class="en">${ind.name_en || ''}</span></span>
          <span style="font-size:11.5px;color:#8a7c6c;">${theme}</span>
        </div>`;
      item.addEventListener('click', () => {
        selectedIndicatorName = ind.name;
        indicatorSelect.style.display = 'none';
        instruction.textContent = `「${ind.name}」已插入牌組，正在洗牌……洗牌之後，抽三張牌～`;

        const oilsSubset = shuffle(OILS).slice(0, FAN_POOL_SIZE - 1).map(c => ({card:c, isIndicator:false}));
        const insertPos = Math.floor(Math.random() * (oilsSubset.length + 1));
        oilsSubset.splice(insertPos, 0, {card: ind, isIndicator:true});
        const finalDeck = shuffle(oilsSubset);

        startShuffleThenFan(finalDeck, true);
      });
      indicatorSelect.appendChild(item);
    });
  }

  // ---------- 扇形排開渲染 ----------
  function layoutFan(){
    const n = fanItems.length;
    const spreadAngle = Math.min(56, n * 5); // 總扇開角度
    const startAngle = -spreadAngle / 2;
    const radius = 210;
    fanItems.forEach((item, i) => {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const angle = startAngle + t * spreadAngle;
      const rad = angle * Math.PI / 180;
      const x = Math.sin(rad) * radius;
      const y = -Math.cos(rad) * radius + radius - 40;
      item.el.style.transform = `translateX(${x}px) translateY(${-y}px) rotate(${angle}deg)`;
      item.el.style.zIndex = i;
    });
  }

  function startShuffleThenFan(deckItems, mode5){
    fanWrap.style.display = 'flex';
    fanStage.innerHTML = '';
    fanStage.classList.add('shuffling');
    deckHint.textContent = '正在洗牌，請稍候……';
    drawnRow.innerHTML = '';
    revealDetail.innerHTML = '';
    revealDetail.classList.remove('active');
    drawnCount = 0;

    fanItems = deckItems.map(d => ({ ...d, el: null }));

    setTimeout(() => {
      fanStage.classList.remove('shuffling');
      fanItems.forEach((item) => {
        const el = document.createElement('div');
        el.className = 'fan-card';
        fanStage.appendChild(el);
        item.el = el;
      });
      layoutFan();

      if (mode5) {
        deckHint.textContent = '點擊扇形中任一張牌，感應你的指示牌位置';
        fanItems.forEach(item => {
          item.el.addEventListener('click', () => revealMode5(), { once:false });
        });
      } else {
        deckHint.textContent = `依序點擊卡牌，抽出第 1 張（共需 ${drawPlan.length} 張）`;
        fanItems.forEach(item => {
          item.el.addEventListener('click', () => drawStandardCard(item), { once:false });
        });
      }
    }, 900);
  }

  function flipCardInPlace(item, label){
    item.el.classList.add('revealed');
    item.el.innerHTML = `<img src="${item.card.image_url}" alt="${item.card.name}"><div class="mini-cap">${item.card.name}</div>`;
  }

  function drawStandardCard(item){
    if (item.el.classList.contains('revealed') || item.el.classList.contains('dimmed')) return;
    if (drawnCount >= drawPlan.length) return;

    const label = drawPlan[drawnCount];
    flipCardInPlace(item, label);
    renderDrawnCard(label, item.card);
    appendDetail(label, item.card);
    drawnCount++;

    if (drawnCount >= drawPlan.length) {
      deckHint.textContent = '解讀完成 ✦ 願這份訊息與你同在';
      fanItems.forEach(i => { if(!i.el.classList.contains('revealed')) i.el.classList.add('dimmed'); });
      againBtn.style.display = 'inline-block';
    } else {
      deckHint.textContent = `依序點擊卡牌，抽出第 ${drawnCount + 1} 張（共需 ${drawPlan.length} 張）`;
    }
  }

  // 模式5：扇形排開後，找出指示牌實際落位，指示牌優先翻開（主導角色），
  // 稍作停頓後才依序翻開左右兩張精油牌回應主題。
  function revealMode5(){
    if (drawnCount > 0) return; // 只能觸發一次
    drawnCount = 1;

    const idx = fanItems.findIndex(i => i.isIndicator);
    const leftIdx = idx - 1;
    const rightIdx = idx + 1;

    fanItems.forEach((item, i) => {
      if (i === idx || i === leftIdx || i === rightIdx) {
        item.el.classList.add('spotlight');
      } else {
        item.el.classList.add('dimmed');
      }
    });

    deckHint.textContent = `「${selectedIndicatorName}」指示牌現身，為你點出主題……`;

    // 第一步：指示牌率先翻開，作為整個牌陣的主導
    const indicatorItem = fanItems[idx];
    flipCardInPlace(indicatorItem, '指示牌');
    renderDrawnCard('指示牌', indicatorItem.card);
    appendDetail('指示牌', indicatorItem.card);

    // 第二步：停頓後，才依序翻開左右兩張精油牌回應這個主題
    setTimeout(() => {
      deckHint.textContent = '正在揭示左右兩側的精油指引……';

      const revealSide = (sideIdx, label, delay) => {
        setTimeout(() => {
          if (sideIdx < 0 || sideIdx >= fanItems.length) return;
          const sideItem = fanItems[sideIdx];
          flipCardInPlace(sideItem, label);
          renderDrawnCard(label, sideItem.card);
          appendDetail(label, sideItem.card);
        }, delay);
      };
      revealSide(leftIdx, `「${selectedIndicatorName}」左側提升精油`, 0);
      revealSide(rightIdx, `「${selectedIndicatorName}」右側提升精油`, 500);

      setTimeout(() => {
        deckHint.textContent = '解讀完成 ✦ 願這份訊息與你同在';
        againBtn.style.display = 'inline-block';
      }, 1100);
    }, 900);
  }

  function renderDrawnCard(label, card){
    const slot = document.createElement('div');
    slot.className = 'drawn-slot';
    slot.innerHTML = `
      <div class="slot-label">${label}</div>
      <div class="drawn-card">
        <img src="${card.image_url}" alt="${card.name}">
        <div class="cap"><b>${card.name}</b><span>${card.name_en || ''}</span></div>
      </div>`;
    drawnRow.appendChild(slot);
  }

  function appendDetail(label, card){
    const el = document.createElement('div');
    el.className = 'detail-card';
    el.innerHTML = `
      <div class="dc-label">${label}</div>
      <div class="dc-name">${card.name}</div>
      <div class="dc-name-en">${card.name_en || ''}</div>
      ${card.keywords ? `<div class="dc-keywords">${card.keywords}</div>` : ''}
      ${card.guidance ? `<div class="dc-guidance">${card.guidance}</div>` : ''}
      ${card.chakra ? `<div class="dc-chakra">脈輪：${card.chakra}</div>` : ''}
    `;
    revealDetail.appendChild(el);
    revealDetail.classList.add('active');
  }

  modeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    enterStage(Number(btn.dataset.mode));
  });

  backBtn.addEventListener('click', showModeSelect);
  againBtn.addEventListener('click', showModeSelect);

  function initFromQuery(){
    const params = new URLSearchParams(window.location.search);
    const m = Number(params.get('mode'));
    if (m >= 1 && m <= 5) enterStage(m);
  }

  // 若透過 LIFF 開啟，初始化 LIFF SDK（LIFF_ID 需替換成你自己的）
  function initLiffIfPresent(){
    const LIFF_ID = "YOUR_LIFF_ID"; // 到 LINE Developers 建立 LIFF 後填入
    if (window.liff && LIFF_ID !== "YOUR_LIFF_ID") {
      liff.init({ liffId: LIFF_ID }).catch(() => {});
    }
  }

  loadData().then(() => {
    instruction.textContent = '';
    initLiffIfPresent();
    initFromQuery();
  }).catch(() => {
    instruction.textContent = '資料讀取失敗，請重新整理頁面再試一次。';
  });
})();
</script>

</body>
</html>
