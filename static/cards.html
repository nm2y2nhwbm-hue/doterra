<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>多特瑞精油洞悉卡</title>
<style>
  :root{
    --parchment:#F3EAE0; --parchment-deep:#E8DCCC;
    --ink:#3F332B; --rose:#8C3B46; --rose-deep:#6E2B34;
    --sage:#78876B; --gold:#B8912E; --card-back:#F6EFE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Serif TC","Songti TC",serif;
    background:radial-gradient(ellipse at top,#F8F1E6 0%,var(--parchment) 55%,var(--parchment-deep) 100%);
    color:var(--ink); min-height:100vh; display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }
  .brand-title{font-family:"Cormorant Garamond","Noto Serif TC",serif;text-align:center;padding:24px 16px 4px;letter-spacing:.12em;}
  .brand-title h1{font-size:clamp(20px,5vw,30px);margin:0 0 4px;color:var(--rose-deep);font-weight:600;}
  .brand-title p{margin:0;font-size:11px;color:var(--sage);letter-spacing:.3em;}
  .rose-divider{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);opacity:.7;margin:8px auto 16px;}
  .rose-divider::before,.rose-divider::after{content:"";flex:1;max-width:70px;height:1px;background:var(--gold);opacity:.5;}

  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:0 16px 100px;}

  #mode-select{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px;margin-top:6px;}
  .mode-btn{background:linear-gradient(135deg,#fff8ef,var(--parchment));border:1px solid rgba(184,145,46,.4);border-radius:14px;padding:16px 20px;text-align:left;cursor:pointer;box-shadow:0 2px 6px rgba(63,51,43,.08);display:flex;align-items:center;gap:14px;}
  .mode-btn:active{transform:scale(.98);}
  .mode-num{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--rose);width:32px;text-align:center;flex-shrink:0;}
  .mode-text b{display:block;font-size:16px;color:var(--ink);}
  .mode-text span{font-size:12px;color:#7a6d5f;}

  #stage{width:100%;max-width:640px;display:none;flex-direction:column;align-items:center;}
  #stage.active{display:flex;}
  .stage-header{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:10px;}
  .back-btn{background:none;border:1px solid var(--rose);color:var(--rose);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;}
  .stage-title{font-size:15px;color:var(--rose-deep);letter-spacing:.05em;}
  .instruction{font-size:13.5px;color:#6b5d4f;text-align:center;margin:6px 0 16px;min-height:18px;}

  /* --- 模式5：指示標題選單 --- */
  #indicator-select{display:none;flex-direction:column;gap:8px;width:100%;max-width:420px;margin:10px 0 20px;}
  .indicator-item{
    background:#fffaf3;border:1px solid rgba(184,145,46,.35);border-radius:10px;
    padding:12px 16px;font-size:14.5px;color:var(--ink);cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;
    transition:background .15s;
  }
  .indicator-item:active{background:var(--parchment-deep);}
  .indicator-item .en{font-size:11px;color:#9a8c7b;}

  /* --- 牌堆抽牌區 --- */
  #deck-zone{display:none;flex-direction:column;align-items:center;gap:14px;margin-top:6px;}
  .deck-stack{position:relative;width:170px;height:236px;cursor:pointer;}
  .deck-stack .stack-card{
    position:absolute;left:0;top:0;width:170px;height:236px;border-radius:14px;
    background:
      radial-gradient(circle at 50% 30%, #fffaf2 0, var(--card-back) 60%),
      repeating-linear-gradient(45deg, rgba(184,145,46,.06) 0 10px, transparent 10px 20px);
    border:2px solid var(--gold);
    box-shadow:0 4px 10px rgba(63,51,43,.15);
  }
  .deck-stack .stack-card::after{content:"❀";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--rose);opacity:.5;}
  .deck-stack.shuffling .stack-card{ animation:shuffleMove 1s ease-in-out infinite; }
  .deck-stack.shuffling .stack-card:nth-child(1){animation-delay:0s;}
  .deck-stack.shuffling .stack-card:nth-child(2){animation-delay:.1s;}
  .deck-stack.shuffling .stack-card:nth-child(3){animation-delay:.2s;}
  @keyframes shuffleMove{
    0%{transform:translate(0,0) rotate(0);}
    25%{transform:translate(-14px,-4px) rotate(-5deg);}
    50%{transform:translate(0,0) rotate(0);}
    75%{transform:translate(14px,-4px) rotate(5deg);}
    100%{transform:translate(0,0) rotate(0);}
  }
  .deck-count{
    position:absolute;bottom:-10px;right:-10px;background:var(--rose);color:#fff;
    font-size:12px;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
  }
  .deck-hint{font-size:12.5px;color:var(--sage);}
  .deck-stack.drawing{pointer-events:none;}
  .deck-stack .draw-fly{
    position:absolute;left:0;top:0;width:170px;height:236px;border-radius:14px;
    transition:transform .55s cubic-bezier(.2,.8,.2,1), opacity .3s ease .3s;
  }

  /* 已抽出的卡（排列於下方） */
  #drawn-row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:10px;}
  .drawn-slot{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .drawn-slot .slot-label{font-size:11.5px;color:var(--sage);letter-spacing:.06em;}
  .drawn-card{
    width:140px;height:196px;border-radius:12px;overflow:hidden;
    border:1.5px solid var(--gold);box-shadow:0 4px 12px rgba(63,51,43,.16);
    background:#fff;display:flex;flex-direction:column;
    animation:cardReveal .5s ease;
  }
  @keyframes cardReveal{ from{opacity:0;transform:translateY(10px) scale(.95);} to{opacity:1;transform:translateY(0) scale(1);} }
  .drawn-card img{width:100%;height:58%;object-fit:cover;}
  .drawn-card .cap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px 6px;text-align:center;}
  .drawn-card .cap b{font-size:12.5px;color:var(--rose-deep);}
  .drawn-card .cap span{font-size:9.5px;color:#8a7c6c;}

  #reveal-detail{width:100%;max-width:520px;margin-top:20px;display:none;flex-direction:column;gap:14px;}
  #reveal-detail.active{display:flex;}
  .detail-card{background:#fffaf3;border:1px solid rgba(184,145,46,.35);border-radius:14px;padding:16px 18px;box-shadow:0 3px 10px rgba(63,51,43,.08);}
  .detail-card .dc-label{font-size:11.5px;color:var(--sage);letter-spacing:.1em;margin-bottom:4px;}
  .detail-card .dc-name{font-size:18px;color:var(--rose-deep);font-weight:600;}
  .detail-card .dc-name-en{font-size:12px;color:#9a8c7b;margin-bottom:8px;}
  .detail-card .dc-keywords{font-size:13px;color:var(--ink);margin-bottom:6px;}
  .detail-card .dc-guidance{font-size:13.5px;line-height:1.75;color:#4a3f35;}
  .detail-card .dc-chakra{font-size:11.5px;color:var(--sage);margin-top:8px;}

  .again-btn{margin:18px auto 0;background:var(--rose);color:#fff;border:none;border-radius:24px;padding:11px 30px;font-size:14px;cursor:pointer;box-shadow:0 4px 12px rgba(140,59,70,.3);}
  .again-btn:active{transform:scale(.97);}

  #line-cta{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(243,234,224,0) 0%,var(--parchment) 30%);padding:14px 16px 18px;display:flex;justify-content:center;}
  #line-cta a{display:inline-flex;align-items:center;gap:8px;background:#06C755;color:#fff;text-decoration:none;padding:11px 26px;border-radius:24px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(6,199,85,.35);}

  @media (max-width:380px){
    .deck-stack,.deck-stack .stack-card{width:140px;height:196px;}
    .drawn-card{width:112px;height:157px;}
  }
</style>
</head>
<body>

<div class="brand-title"><h1>多特瑞精油洞悉卡</h1><p>MODERN OIL ORACLE</p></div>
<div class="rose-divider">❀</div>

<main>

  <div id="mode-select">
    <div class="mode-btn" data-mode="1"><div class="mode-num">01</div><div class="mode-text"><b>今日能量</b><span>單張心靈肯定小語</span></div></div>
    <div class="mode-btn" data-mode="2"><div class="mode-num">02</div><div class="mode-text"><b>生活導引</b><span>現階段狀態與方向指引</span></div></div>
    <div class="mode-btn" data-mode="3"><div class="mode-num">03</div><div class="mode-text"><b>三牌陣</b><span>身・心・靈全方位深度解析</span></div></div>
    <div class="mode-btn" data-mode="4"><div class="mode-num">04</div><div class="mode-text"><b>了解自我</b><span>別人眼中的你與真正的你</span></div></div>
    <div class="mode-btn" data-mode="5"><div class="mode-num">05</div><div class="mode-text"><b>指示牌</b><span>單一指示牌與精油對應占卜</span></div></div>
  </div>

  <div id="stage">
    <div class="stage-header">
      <button class="back-btn" id="back-btn">← 返回牌陣選單</button>
      <div class="stage-title" id="stage-title"></div>
    </div>
    <div class="instruction" id="instruction"></div>

    <!-- 模式5專用：先選指示標題 -->
    <div id="indicator-select"></div>

    <!-- 牌堆抽牌區 -->
    <div id="deck-zone">
      <div class="deck-stack" id="deck-stack">
        <div class="stack-card"></div>
        <div class="stack-card"></div>
        <div class="stack-card"></div>
        <div class="deck-count" id="deck-count">0</div>
      </div>
      <div class="deck-hint" id="deck-hint">點擊牌堆，抽出第 1 張</div>
      <div id="drawn-row"></div>
    </div>

    <div id="reveal-detail"></div>
    <button class="again-btn" id="again-btn" style="display:none;">再抽一次 / 選擇其他牌陣</button>
  </div>

</main>

<div id="line-cta">
  <a href="https://line.me/R/ti/p/@your-line-id" target="_blank" rel="noopener">加入 LINE 官方帳號 →</a>
</div>

<script>
(function(){
  "use strict";

  const modeSelect = document.getElementById('mode-select');
  const stage = document.getElementById('stage');
  const stageTitle = document.getElementById('stage-title');
  const instruction = document.getElementById('instruction');
  const indicatorSelect = document.getElementById('indicator-select');
  const deckZone = document.getElementById('deck-zone');
  const deckStack = document.getElementById('deck-stack');
  const deckCount = document.getElementById('deck-count');
  const deckHint = document.getElementById('deck-hint');
  const drawnRow = document.getElementById('drawn-row');
  const revealDetail = document.getElementById('reveal-detail');
  const againBtn = document.getElementById('again-btn');
  const backBtn = document.getElementById('back-btn');

  let OILS = [];
  let INDICATORS = [];

  const MODE_CONFIG = {
    1: { title: "今日能量", count: 1, labels: ["今日心靈小語"] },
    2: { title: "生活導引", count: 2, labels: ["目前整體狀況", "生活中所需的建議及方向"] },
    3: { title: "三牌陣",   count: 3, labels: ["身・目前身體狀況", "心・目前心理狀態", "靈・目前精神狀況"] },
    4: { title: "了解自我", count: 3, labels: ["別人眼中的你", "私底下獨處時的你", "真正自我的你"] },
  };

  // 目前這一局的抽牌牌組（背面朝上待抽），以及已抽出的紀錄
  let currentDeck = [];      // { card, isIndicator }
  let drawPlan = [];         // 每次點擊要用的 label 清單
  let drawnCount = 0;
  let selectedIndicatorName = null;

  async function loadData(){
    const [oilsRes, indRes] = await Promise.all([fetch('/api/oils'), fetch('/api/indicators')]);
    OILS = await oilsRes.json();
    INDICATORS = await indRes.json();
  }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function resetStageDom(){
    indicatorSelect.style.display = 'none';
    indicatorSelect.innerHTML = '';
    deckZone.style.display = 'none';
    deckStack.classList.remove('shuffling');
    drawnRow.innerHTML = '';
    revealDetail.innerHTML = '';
    revealDetail.classList.remove('active');
    againBtn.style.display = 'none';
    currentDeck = [];
    drawPlan = [];
    drawnCount = 0;
    selectedIndicatorName = null;
  }

  function showModeSelect(){
    stage.classList.remove('active');
    modeSelect.style.display = 'flex';
  }

  function enterStage(modeId){
    modeSelect.style.display = 'none';
    stage.classList.add('active');
    resetStageDom();

    if (modeId === 5) {
      stageTitle.textContent = '指示牌';
      instruction.textContent = '請先從下方選擇一個你想探索的主題';
      renderIndicatorList();
      return;
    }

    const cfg = MODE_CONFIG[modeId];
    stageTitle.textContent = cfg.title;
    startShuffleThenDeck(shuffle(OILS).slice(0, Math.max(cfg.count * 3, 12)).map(c => ({card:c})), cfg.labels);
  }

  // ---------- 模式5：先選指示標題，選定後才把該張指示卡「插入」牌堆一起洗牌 ----------
  function renderIndicatorList(){
    indicatorSelect.style.display = 'flex';
    INDICATORS.forEach(ind => {
      const item = document.createElement('div');
      item.className = 'indicator-item';
      item.innerHTML = `<span>${ind.name}</span><span class="en">${ind.name_en || ''}</span>`;
      item.addEventListener('click', () => {
        selectedIndicatorName = ind.name;
        indicatorSelect.style.display = 'none';
        instruction.textContent = `「${ind.name}」已插入牌組，正在洗牌……`;

        // 指示卡插入 69 張精油牌堆一起洗牌
        const mixedPool = shuffle(OILS).slice(0, 12);
        const deckItems = mixedPool.map(c => ({card:c, isIndicator:false}));
        const insertPos = Math.floor(Math.random() * (deckItems.length + 1));
        deckItems.splice(insertPos, 0, {card: ind, isIndicator:true});
        const finalDeck = shuffle(deckItems);

        const labels = [
          '抽出指示牌／精油牌（第 1 張）',
          '抽出指示牌／精油牌（第 2 張）',
          '抽出指示牌／精油牌（第 3 張）',
        ];
        startShuffleThenDeck(finalDeck, labels, true);
      });
      indicatorSelect.appendChild(item);
    });
  }

  // ---------- 共用：洗牌動畫 → 顯示牌堆供點擊抽牌 ----------
  function startShuffleThenDeck(deckItems, labels, isMode5){
    deckZone.style.display = 'flex';
    deckStack.classList.add('shuffling');
    deckHint.textContent = '正在洗牌，請稍候……';
    deckCount.textContent = deckItems.length;

    setTimeout(() => {
      deckStack.classList.remove('shuffling');
      currentDeck = deckItems;
      drawPlan = labels;
      drawnCount = 0;
      deckCount.textContent = currentDeck.length;

      if (isMode5) {
        deckHint.textContent = '點擊牌堆，抽出指示牌與左右精油牌';
      } else {
        deckHint.textContent = `點擊牌堆，抽出第 1 張（共需 ${labels.length} 張）`;
      }

      deckStack.onclick = () => drawOneFromDeck(isMode5);
    }, 1100);
  }

  function drawOneFromDeck(isMode5){
    if (currentDeck.length === 0 || drawnCount >= drawPlan.length) return;

    // 模式5的抽牌順序：指示牌一定第一個被抽到（象徵先確立主題），
    // 若還沒抽到指示牌，優先把它抽出來；其餘照隨機順序抽。
    let idx;
    if (isMode5 && drawnCount === 0) {
      idx = currentDeck.findIndex(item => item.isIndicator);
      if (idx === -1) idx = 0;
    } else {
      idx = Math.floor(Math.random() * currentDeck.length);
    }

    const drawnItem = currentDeck.splice(idx, 1)[0];
    deckCount.textContent = currentDeck.length;

    let label;
    if (isMode5) {
      label = drawnItem.isIndicator ? '指示牌' : (
        drawnCount === 1
          ? `「${selectedIndicatorName}」左側提升精油`
          : `「${selectedIndicatorName}」右側提升精油`
      );
    } else {
      label = drawPlan[drawnCount];
    }

    renderDrawnCard(label, drawnItem.card);
    appendDetail(label, drawnItem.card);
    drawnCount++;

    const totalNeeded = isMode5 ? 3 : drawPlan.length;
    if (drawnCount >= totalNeeded) {
      deckHint.textContent = '解讀完成 ✦ 願這份訊息與你同在';
      deckStack.onclick = null;
      deckStack.style.opacity = '.35';
      againBtn.style.display = 'inline-block';
    } else {
      deckHint.textContent = `點擊牌堆，抽出第 ${drawnCount + 1} 張（共需 ${totalNeeded} 張）`;
    }

    if (currentDeck.length === 0 && drawnCount < totalNeeded) {
      deckHint.textContent = '牌堆已抽完';
      deckStack.onclick = null;
    }
  }

  function renderDrawnCard(label, card){
    const slot = document.createElement('div');
    slot.className = 'drawn-slot';
    slot.innerHTML = `
      <div class="slot-label">${label}</div>
      <div class="drawn-card">
        <img src="${card.image_url}" alt="${card.name}">
        <div class="cap"><b>${card.name}</b><span>${card.name_en || ''}</span></div>
      </div>`;
    drawnRow.appendChild(slot);
  }

  function appendDetail(label, card){
    const el = document.createElement('div');
    el.className = 'detail-card';
    el.innerHTML = `
      <div class="dc-label">${label}</div>
      <div class="dc-name">${card.name}</div>
      <div class="dc-name-en">${card.name_en || ''}</div>
      ${card.keywords ? `<div class="dc-keywords">${card.keywords}</div>` : ''}
      ${card.guidance ? `<div class="dc-guidance">${card.guidance}</div>` : ''}
      ${card.chakra ? `<div class="dc-chakra">脈輪：${card.chakra}</div>` : ''}
    `;
    revealDetail.appendChild(el);
    revealDetail.classList.add('active');
  }

  modeSelect.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    enterStage(Number(btn.dataset.mode));
  });

  backBtn.addEventListener('click', showModeSelect);
  againBtn.addEventListener('click', showModeSelect);

  // 支援 ?mode=X 網址參數，從 LINE Flex 按鈕直接跳入對應模式
  function initFromQuery(){
    const params = new URLSearchParams(window.location.search);
    const m = Number(params.get('mode'));
    if (m >= 1 && m <= 5) enterStage(m);
  }

  loadData().then(() => {
    instruction.textContent = '';
    initFromQuery();
  }).catch(() => {
    instruction.textContent = '資料讀取失敗，請重新整理頁面再試一次。';
  });
})();
</script>

</body>
</html>
