name: Testing Depth 2.0 CI

on:
  push:
    branches:
      - main
      - 'test/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Agent 1 Quality & Security Test Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Testing Depth 2.0 Matrix (Agent 1 Gatekeeper)
        env:
          CHANNEL_ACCESS_TOKEN: 'ci-mock-access-token-agent1'
          CHANNEL_SECRET: 'ci-mock-channel-secret-agent1'
        run: |
          python tests/run_all_tests.py
